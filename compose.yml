services:
  igle:
    build: .
    image: igle-songs
    container_name: igle
    restart: unless-stopped
    env_file: .env
    ports:
      # solo en local: el proxy (caddy) la publica; con 0.0.0.0 docker se salta el firewall
      - "127.0.0.1:9999:9999"
    volumes:
      # archivos en proceso (pptxs, pdfs, pngs) persisten fuera del contenedor
      - ./data:/app/data:Z
